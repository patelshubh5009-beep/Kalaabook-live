            theme: {
                extend: {

</head>
<body class="bg-obsidian text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-champagne/20 sticky top-0 bg-obsidian/95 backdrop-blur z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <span class="text-2xl font-serif font-bold tracking-wider text-champagne">KalaaBook</span>
            <button id="openModalBtn" class="bg-champagne text-obsidian px-5 py-2.5 rounded-full font-medium text-sm hover:bg-champagneDark transition shadow-lg">
                Join as Artist
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center flex-grow">
        <h1 class="text-4xl sm:text-6xl font-serif font-bold tracking-tight mb-6 text-champagne">
            Luxury Beauty & Grooming, Curated.
        </h1>
        <p class="max-w-2xl mx-auto text-gray-400 text-lg mb-10">
            Connect with premier salons and independent home-service artists for mehendi, nails, hair, and bridal styling.
        </p>

        <!-- Search & Filter Bar -->
        <div class="max-w-3xl mx-auto bg-obsidian border border-champagne/30 rounded-2xl p-3 shadow-2xl flex flex-col sm:flex-row gap-3">
            <div class="flex-1 flex items-center px-4 bg-white/5 rounded-xl border border-white/10">
                <i class="fas fa-search text-champagne mr-3"></i>
                <input type="text" id="searchInput" placeholder="Search service (e.g., Bridal Mehendi, Nail Art)" class="w-full bg-transparent py-3 text-white placeholder-gray-400 focus:outline-none text-sm">
            </div>
            <div class="flex-1 flex items-center px-4 bg-white/5 rounded-xl border border-white/10">
                <i class="fas fa-map-marker-alt text-champagne mr-3"></i>
                <input type="text" id="locationInput" placeholder="Location (e.g., Nadiad, Oshawa)" class="w-full bg-transparent py-3 text-white placeholder-gray-400 focus:outline-none text-sm">
            </div>
            <button id="searchBtn" class="bg-champagne text-obsidian px-8 py-3 rounded-xl font-semibold hover:bg-champagneDark transition">
                Search
            </button>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="max-w-5xl mx-auto mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 text-left">
            <!-- Dynamic search cards will appear here -->
        </div>
    </section>

    <!-- Artist Registration Modal -->
    <div id="artistModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-obsidian border border-champagne/30 rounded-3xl max-w-lg w-full p-8 relative shadow-2xl">
            <button id="closeModalBtn" class="absolute top-6 right-6 text-gray-400 hover:text-champagne text-lg">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="text-2xl font-serif font-bold text-champagne mb-2">Join KalaaBook as an Artist</h2>
            <p class="text-sm text-gray-400 mb-6">List your salon or independent portfolio to connect with clients.</p>
            
            <form id="artistForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-champagne mb-1 font-medium">Full Name / Business Name</label>
                    <input type="text" id="artistName" required placeholder="e.g., Priya's Henna Art" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-champagne">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-champagne mb-1 font-medium">Service Type</label>
                    <input type="text" id="serviceName" required placeholder="e.g., Bridal Mehendi & Nail Styling" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-champagne">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-champagne mb-1 font-medium">Location / City</label>
                    <input type="text" id="artistLocation" required placeholder="e.g., Nadiad, Gujarat / Oshawa, ON" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-champagne">
                </div>
                <button type="submit" id="submitArtistBtn" class="w-full bg-champagne text-obsidian py-3 rounded-xl font-semibold hover:bg-champagneDark transition mt-2">
                    Complete Registration
                </button>
            </form>
            <p id="formFeedback" class="text-xs text-center mt-4 hidden"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-champagne/20 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 KalaaBook. All rights reserved.</p>
    </footer>

    <!-- Supabase Integration Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qreawwce0ebjswobahrig.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QreawwC_0ebjswoBAHrig_Ixzry...';[cite: 1]
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Modal triggers
        const modal = document.getElementById('artistModal');
        document.getElementById('openModalBtn').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

        // Search database logic
        async function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value;
            const locationTerm = document.getElementById('locationInput').value;
            const resultsContainer = document.getElementById('resultsContainer');

            resultsContainer.innerHTML = '<p class="text-gray-400 col-span-full text-center">Searching artists...</p>';

            const { data, error } = await supabase
                .from('artists')
                .select('*')
                .ilike('service_name', `%${searchTerm}%`)
                .ilike('location', `%${locationTerm}%`);

            if (error) {
                resultsContainer.innerHTML = '<p class="text-red-400 col-span-full text-center">Error loading results. Check your Supabase URL.</p>';
            } else if (!data || data.length === 0) {
                resultsContainer.innerHTML = '<p class="text-gray-400 col-span-full text-center">No artists found matching your criteria.</p>';
            } else {
                resultsContainer.innerHTML = '';
                data.forEach(artist => {
                    resultsContainer.innerHTML += `
                        <div class="bg-white/5 border border-champagne/20 rounded-2xl p-5 hover:border-champagne/60 transition">
                            <h3 class="text-lg font-serif font-bold text-champagne">${artist.name}</h3>
                            <p class="text-xs text-gray-400 mt-1"><i class="fas fa-map-marker-alt text-champagne mr-1"></i> ${artist.location}</p>
                            <p class="text-sm text-gray-300 mt-3">${artist.service_name}</p>
                            <button class="mt-5 w-full bg-champagne/10 border border-champagne/40 text-champagne py-2 rounded-xl text-xs font-medium hover:bg-champagne hover:text-obsidian transition">
                                Book Now
                            </button>
                        </div>
                    `;
                });
            }
        }
        document.getElementById('searchBtn').addEventListener('click', handleSearch);

        // Artist submission logic
        document.getElementById('artistForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const feedback = document.getElementById('formFeedback');
            const submitBtn = document.getElementById('submitArtistBtn');

            const name = document.getElementById('artistName').value;
            const service_name = document.getElementById('serviceName').value;
            const location = document.getElementById('artistLocation').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const { error } = await supabase.from('artists').insert([{ name, service_name, location }]);

            if (error) {
                feedback.textContent = 'Error saving profile. Try again.';
                feedback.className = 'text-xs text-center mt-4 text-red-400';
                feedback.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration';
            } else {
                feedback.textContent = 'Success! Your profile is listed.';
                feedback.className = 'text-xs text-center mt-4 text-champagne';
                feedback.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.getElementById('artistForm').reset();
                    feedback.classList.add('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Complete Registration';
                }, 2000);
            }
        });
    </script>
</body>
</html>
