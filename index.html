<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalaaBook | Book Top Salons & Independent Artists</title>
    <meta name="description" content="Discover and book verified independent beauty artists, mehendi experts, nail technicians, and premier salons.">
    <!-- Tailwind CSS CDN for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#08030A',
                        champagne: '#D9C2A0',
                        champagneDark: '#b89d75'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-obsidian text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-champagne/20 sticky top-0 bg-obsidian/95 backdrop-blur z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-serif font-bold tracking-wider text-champagne">KalaaBook</span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm text-gray-300">
                <a href="#explore" class="hover:text-champagne transition">Explore Artists</a>
                <a href="#salons" class="hover:text-champagne transition">Salons</a>
                <a href="#about" class="hover:text-champagne transition">About</a>
            </nav>
            <div>
                <button class="bg-champagne text-obsidian px-5 py-2.5 rounded-full font-medium text-sm hover:bg-champagneDark transition">
                    Artist Login
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center flex-grow">
        <h1 class="text-4xl sm:text-6xl font-serif font-bold tracking-tight mb-6 text-champagne">
            Luxury Beauty & Grooming, Curated.
        </h1>
        <p class="max-w-2xl mx-auto text-gray-400 text-lg mb-10">
            Connect with premier salons and independent home-service artists for mehendi, nails, hair, and bridal styling.
        </p>

        <!-- Search & Filter Bar -->
        <div class="max-w-3xl mx-auto bg-obsidian border border-champagne/30 rounded-2xl p-3 shadow-2xl flex flex-col sm:flex-row gap-3">
            <div class="flex-1 flex items-center px-4 bg-white/5 rounded-xl border border-white/10">
                <i class="fas fa-search text-champagne mr-3"></i>
                <input type="text" placeholder="Search service (e.g., Bridal Mehendi, Nail Art)" class="w-full bg-transparent py-3 text-white placeholder-gray-400 focus:outline-none text-sm">
            </div>
            <div class="flex-1 flex items-center px-4 bg-white/5 rounded-xl border border-white/10">
                <i class="fas fa-map-marker-alt text-champagne mr-3"></i>
                <input type="text" placeholder="Location (e.g., Nadiad, Oshawa)" class="w-full bg-transparent py-3 text-white placeholder-gray-400 focus:outline-none text-sm">
            </div>
            <button class="bg-champagne text-obsidian px-8 py-3 rounded-xl font-semibold hover:bg-champagneDark transition">
                Search
            </button>
        </div>

        <!-- Filter Pills -->
        <div class="flex justify-center flex-wrap gap-3 mt-8">
            <button class="px-5 py-2 rounded-full border border-champagne/40 bg-champagne/10 text-champagne text-xs font-medium">All Services</button>
            <button class="px-5 py-2 rounded-full border border-white/10 hover:border-champagne/40 text-gray-300 text-xs font-medium transition">Mehendi & Henna</button>
            <button class="px-5 py-2 rounded-full border border-white/10 hover:border-champagne/40 text-gray-300 text-xs font-medium transition">Nail Art</button>
            <button class="px-5 py-2 rounded-full border border-white/10 hover:border-champagne/40 text-gray-300 text-xs font-medium transition">Bridal Makeup</button>
            <button class="px-5 py-2 rounded-full border border-white/10 hover:border-champagne/40 text-gray-300 text-xs font-medium transition">Home Service</button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-champagne/20 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 KalaaBook. All rights reserved.</p>
    </footer>

</body>
</html>
